---
# cPanel Git Version Control deployment configuration
#
# ⚠️  PENTING: Ganti nilai DEPLOYPATH di bawah sesuai path hosting kamu.
#     Contoh: /home/rayakons/public_html/raya-tender
#
# Cara deploy:
#   1. Push ke GitHub (git push origin main)
#   2. Di cPanel → Git Version Control → klik "Update" / "Deploy HEAD Commit"
#   3. Atau aktifkan Auto-Deploy agar otomatis setiap push

deployment:
  tasks:
    # ── PATH SERVER ────────────────────────────────────────────
    - export DEPLOYPATH=/home/rayakons/public_html/raya-tender

    # ── BUAT FOLDER RUNTIME YANG DIPERLUKAN ────────────────────
    - mkdir -p $DEPLOYPATH/storage/framework/cache/data
    - mkdir -p $DEPLOYPATH/storage/framework/sessions
    - mkdir -p $DEPLOYPATH/storage/framework/views
    - mkdir -p $DEPLOYPATH/storage/logs
    - mkdir -p $DEPLOYPATH/bootstrap/cache

    # ── SYNC FILE KE SERVER ────────────────────────────────────
    # --delete : hapus file lama yang sudah tidak ada di repo
    - /bin/rsync -az --delete ./ $DEPLOYPATH/ \
        --exclude='.git' \
        --exclude='.env' \
        --exclude='node_modules' \
        --exclude='storage/app' \
        --exclude='storage/logs'

    # ── INSTALL PHP DEPENDENCIES ───────────────────────────────
    - cd $DEPLOYPATH && /usr/local/bin/php /usr/local/bin/composer install --no-dev --optimize-autoloader

    # ── SYMLINK STORAGE ────────────────────────────────────────
    - cd $DEPLOYPATH && /usr/local/bin/php artisan storage:link --force

    # ── CACHE LARAVEL ──────────────────────────────────────────
    - cd $DEPLOYPATH && /usr/local/bin/php artisan config:cache
    - cd $DEPLOYPATH && /usr/local/bin/php artisan route:cache
    - cd $DEPLOYPATH && /usr/local/bin/php artisan view:cache

    # ── MIGRASI DATABASE ───────────────────────────────────────
    - cd $DEPLOYPATH && /usr/local/bin/php artisan migrate --force

    # ── PERMISSIONS ────────────────────────────────────────────
    - chmod -R 775 $DEPLOYPATH/storage
    - chmod -R 775 $DEPLOYPATH/bootstrap/cache
